[project]
name = "finlens-api"
version = "0.1.0"
description = "Finlens backend — statement ingestion, normalization, categorization, and analytics."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "python-multipart>=0.0.12",
    "pdfplumber>=0.11",
    "redis>=5.1",
    "rq>=2.0",
    "python-dateutil>=2.9",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "httpx>=0.27",
]
