services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finlens
      POSTGRES_PASSWORD: finlens
      POSTGRES_DB: finlens
    ports:
      - "5432:5432"
    volumes:
      - finlens_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://finlens:finlens@postgres:5432/finlens
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

volumes:
  finlens_postgres_data:
